name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build/test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Vendor dependency, verify SRI, syntax and unit tests
        run: npm run check
      - name: Upload prepared Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Temporarily disabled until we can resolve the issues with the Playwright tests on GitHub Actions.
  # browser:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       browser: [chromium, firefox, webkit]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '22'
  #     - run: npm install --ignore-scripts --no-audit --no-fund
  #     - run: npm run vendor:xmldsig && npm run verify:vendor
  #     - run: npx playwright install --with-deps ${{ matrix.browser }}
  #     - run: npx playwright test --project=${{ matrix.browser }}

  deploy:
    needs: [build, browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
